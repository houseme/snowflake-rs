name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  rust_fmt_check:
    name: RustFmt check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt -- --check

  clippy_check:
    name: Clippy check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        rust: [ stable, beta, nightly ]
        exclude:
          - os: windows-latest
            rust: beta
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Run cargo test (all features)
        if: runner.os != 'Windows'
        run: cargo +${{ matrix.rust }} test --all-features
      - name: Run cargo test (all features except ip-fallback)
        if: runner.os == 'Windows'
        run: cargo +${{ matrix.rust }} test --features "std serde tracing metrics use-strong-cas"
      - name: Run cargo test (no default features)
        run: cargo +${{ matrix.rust }} test --no-default-features
      - name: Run cargo test (no_std with serde)
        run: cargo +${{ matrix.rust }} test --no-default-features --features serde
      - name: Check release-mode boundary regressions
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo +stable test --release --test builder_boundaries --test clock_test --test encoding_test

  no_std_check:
    name: no_std build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - name: Check no_std library on a bare-metal target
        run: cargo check --locked --lib --no-default-features --target aarch64-unknown-none
      - name: Check no_std library with serde on a bare-metal target
        run: cargo check --locked --lib --no-default-features --features serde --target aarch64-unknown-none
      - name: Check no_std doc
        run: cargo doc --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  wasm_check:
    name: WASM build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build for WASM
        run: cargo build --target wasm32-unknown-unknown --no-default-features

  msrv_check:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Check default library with MSRV
        run: cargo +1.88.0 check --locked --lib
      - name: Check all library features with MSRV
        run: cargo +1.88.0 check --locked --lib --all-features
      - name: Check no_std library with MSRV
        run: cargo +1.88.0 check --locked --lib --no-default-features
      - name: Check no_std library with serde and MSRV
        run: cargo +1.88.0 check --locked --lib --no-default-features --features serde

  loom_check:
    name: Loom reservation model (${{ matrix.cas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cas: [weak, strong]
    env:
      RUSTFLAGS: "--cfg loom"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
      - name: Model weak CAS reservations
        if: matrix.cas == 'weak'
        run: cargo test --locked --test loom_test
      - name: Model strong CAS reservations
        if: matrix.cas == 'strong'
        run: cargo test --locked --features use-strong-cas --test loom_test

  doc_check:
    name: Documentation check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Run doc tests
        run: cargo test --doc

  publish_on_crates_io:
    name: Publish on crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    needs:
      - rust_fmt_check
      - clippy_check
      - test
      - no_std_check
      - wasm_check
      - msrv_check
      - loom_check
      - doc_check
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run cargo publish
        run: cargo publish --registry crates-io --package snowflake_me --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
